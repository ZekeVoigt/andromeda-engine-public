[project]
name = "outcome-engine"
version = "0.1.0"
description = "Outcome verification for coding agents: grade whether a diff does what was asked"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "pydantic>=2",
]

[project.scripts]
outcome = "andromeda.outcome.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andromeda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "task_image: needs a SWE-bench Pro task image (a multi-GB pull)",
]
